name: Build downloadable APK release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-apk-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon packageDebugApks
          else
            gradle --no-daemon packageDebugApks
          fi

      - name: Read app version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          from pathlib import Path

          version_name = ""
          version_code = ""
          props = Path("gradle.properties")
          if props.exists():
              for line in props.read_text(encoding="utf-8", errors="ignore").splitlines():
                  if line.startswith("runForestVersionName="):
                      version_name = line.split("=", 1)[1].strip()
                  if line.startswith("runForestVersionCode="):
                      version_code = line.split("=", 1)[1].strip()

          if not version_name:
              version_name = f"0.0.{os.environ['GITHUB_RUN_NUMBER']}"
          if not version_code:
              version_code = os.environ["GITHUB_RUN_NUMBER"]

          safe_version = re.sub(r"[^A-Za-z0-9._-]+", "-", version_name).strip("-")
          print(f"APP_VERSION={safe_version or '0.0.' + os.environ['GITHUB_RUN_NUMBER']}")
          print(f"APP_BUILD={version_code}")
          PY

      - name: Prepare versioned downloadable APK
        shell: bash
        run: |
          apk_name="runForest-v${APP_VERSION}-build-${APP_BUILD}-arm64-v8a-debug.apk"
          apk_path="artifacts/${apk_name}"

          if [ ! -f "$apk_path" ]; then
            echo "No debug APK was produced at $apk_path."
            find . -path '*/build/outputs/*' -type f || true
            find artifacts -type f || true
            exit 1
          fi

          echo "APK_PATH=$apk_path" >> "$GITHUB_ENV"

      - name: Publish downloadable GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}
          name: runForest v${{ env.APP_VERSION }}
          body: |
            runForest Android debug APK for v${{ env.APP_VERSION }} build ${{ env.APP_BUILD }}.

            APK file name includes version, build, ABI, and build type.
          artifacts: ${{ env.APK_PATH }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
